<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF2EE;--card:#fff;--ink:#14302A;--mute:#5B726B;--line:#D3DED8;--ok:#2B8A57;--okbg:#DDF1E5;--warn:#B07700;--warnbg:#FFF1CC;--bad:#C93A22;--badbg:#FCE3DD;--btn:#14302A;--btnink:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1B18;--card:#182723;--ink:#E7F0EC;--mute:#92A9A1;--line:#2B3F39;--ok:#58C58A;--okbg:#1B3A2B;--warn:#F2C14E;--warnbg:#3B3014;--bad:#FF7A62;--badbg:#44211B;--btn:#E7F0EC;--btnink:#0F1B18;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1B18;--card:#182723;--ink:#E7F0EC;--mute:#92A9A1;--line:#2B3F39;--ok:#58C58A;--okbg:#1B3A2B;--warn:#F2C14E;--warnbg:#3B3014;--bad:#FF7A62;--badbg:#44211B;--btn:#E7F0EC;--btnink:#0F1B18;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(circle at 100% 0,rgba(242,182,50,.16) 0,transparent 45%),radial-gradient(circle at 0 100%,rgba(43,138,87,.16) 0,transparent 42%);background-attachment:fixed;color:var(--ink);font:400 16px/1.4 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:18px 16px 90px}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 14px}
h2{font-size:18px;font-weight:800;margin:26px 0 10px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.sum .big{grid-column:1/-1}
.sum b{display:block;font-size:24px;font-weight:800}.sum .big b{font-size:34px}
.sum span,.mute{color:var(--mute);font-size:14px}
.al{display:flex;gap:12px;align-items:center;border-radius:16px;padding:12px;margin-bottom:10px;background:var(--warnbg);border-left:6px solid var(--warn)}
.al.bad{background:var(--badbg);border-color:var(--bad)}
.n{min-width:64px;text-align:center;font-weight:800;line-height:1}
.n i{display:block;font-style:normal;font-size:34px}.n small{font-size:13px;font-weight:600}
.al p{margin:0 0 8px}.al strong{display:block}
.d{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.d header{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.d h3{margin:0;font-size:18px;font-weight:800}
.tag{font-size:13px;color:var(--mute)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{font:600 15px inherit;font-family:inherit;border:0;border-radius:12px;padding:11px 16px;background:var(--btn);color:var(--btnink);cursor:pointer;min-height:44px}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.4}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 4px 14px rgba(0,0,0,.25);border-radius:999px;padding:14px 20px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.ov[hidden]{display:none}
.sh{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.sh h2{margin-top:0}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
input,select{width:100%;font:inherit;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px}
.pv{max-width:100%;max-height:200px;border-radius:10px;margin-top:8px}
.h{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.h img{width:44px;height:44px;object-fit:cover;border-radius:8px;cursor:pointer}
.h div{flex:1}.empty{color:var(--mute);padding:6px 0}
.ok{color:var(--ok);font-weight:600}
.r{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;font-weight:400}
.r b{font-size:18px;font-weight:800;display:block}.r>div:first-child{flex:1}.rt{text-align:right}
.bar{height:6px;background:var(--line);border-radius:6px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:12px;margin:4px 0 18px}.logo{width:54px;height:54px;flex:none}.brand{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.05}.top p{margin:3px 0 0;color:var(--mute);font-size:14px}
.ck{display:flex;align-items:center;gap:10px;font-weight:400;margin-top:10px}.ck input{width:24px;min-height:24px;flex:none}
.help{margin-left:auto;width:42px;height:42px;padding:0;border-radius:50%;font-size:20px;font-weight:800}
.dots{display:flex;gap:6px;margin:14px 0}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{width:22px;border-radius:6px;background:var(--ok)}
.toast{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));z-index:30;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-weight:600;max-width:488px;margin:0 auto}
</style></head><body><main>
<header class="top"><svg class="logo" viewBox="0 0 64 64" role="img" aria-label="Al Corriente"><rect width="64" height="64" rx="15" fill="#14302A"/><circle cx="30" cy="34" r="19" fill="#BFE8D0"/><path d="M20 34.5l8 8 15-17" fill="none" stroke="#14302A" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="48" cy="16" r="9" fill="#F2B632"/><text x="48" y="20.5" text-anchor="middle" font-size="12" font-weight="800" font-family="Arial,sans-serif" fill="#14302A">$</text></svg><div><div class="brand">Al Corriente</div><p>Organiza tu vida</p></div><button class="g help" id="help" aria-label="¿Cómo se usa?">?</button></header>
<div id="app"></div>
</main>
<button class="fab" id="add">+ Agregar</button>
<div id="ov" class="ov" hidden></div>
<script>
const KEY='otv-v1';let S={debts:[],pays:[]};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('No hay espacio para guardar. Borra algún comprobante viejo.')}};
const $=s=>document.querySelector(s);
window.alert=m=>{const e=document.createElement('div');e.className='toast';e.setAttribute('role','alert');e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),4500)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mx=n=>Number(n).toLocaleString('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0});
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const ymd=d=>d.getFullYear()*1e4+(d.getMonth()+1)*100+d.getDate();
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>new Date(s+'T00:00');
const lastDay=(y,m)=>new Date(y,m+1,0).getDate();
const fmt=d=>d.toLocaleDateString('es-MX',{day:'numeric',month:'long'});
const fd=d=>d.toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'});
const MIN=new Date(2000,0,1);
/* migrar deudas guardadas con la versión anterior (solo mensuales) */
S.debts.forEach(d=>{if(!d.frec){d.frec='mensual';d.n=0;const f=d.from||0,y=Math.floor(f/100),m=f%100-1;d.primero=iso(new Date(y,m,Math.min(d.dia,lastDay(y,m))))}});
S.pays.forEach(p=>{if(p.cycle>0&&p.cycle<1e7){const d=S.debts.find(x=>x.id===p.debt);const y=Math.floor(p.cycle/100),m=p.cycle%100-1;p.cycle=d?ymd(new Date(y,m,Math.min(d.dia||1,lastDay(y,m)))):0}});
/* fechas de pago de una deuda según su frecuencia y plazo */
function* seq(d){
 const p=pd(d.primero),y=p.getFullYear(),m=p.getMonth(),dd=p.getDate(),lim=d.n>0?d.n:1e5;
 let yy=y,mm=m,slot=dd>15?2:1;const base=dd>15?dd-15:dd;
 for(let i=0;i<lim;i++){
  if(d.frec==='diario')yield new Date(y,m,dd+i);
  else if(d.frec==='semanal')yield new Date(y,m,dd+7*i);
  else if(d.frec==='quincenal'){yield new Date(yy,mm,slot===1?base:Math.min(base+15,lastDay(yy,mm)));if(slot===1)slot=2;else{slot=1;mm++}}
  else if(d.frec==='bimestral')yield new Date(y,m+2*i,Math.min(dd,lastDay(y,m+2*i)));
  else yield new Date(y,m+i,Math.min(dd,lastDay(y,m+i)));
 }}
const paid=(d,k)=>S.pays.some(p=>p.debt===d.id&&p.cycle===k);
function nextCycle(d){const t=today();for(const due of seq(d)){if(due-t>4e10)break;const k=ymd(due);if(paid(d,k))continue;return{due,key:k,days:Math.round((due-t)/864e5)}}return null}
function span(d,a,b){const r=[];for(const due of seq(d)){if(due>b)break;if(due>=a){const k=ymd(due);r.push({due,key:k,paid:paid(d,k)})}}return r}
const mr=(t,o)=>[new Date(t.getFullYear(),t.getMonth()+o,1),new Date(t.getFullYear(),t.getMonth()+o+1,0)];
const FR={diario:'cada día',semanal:'cada semana',quincenal:'cada quincena',mensual:'cada mes',bimestral:'cada 2 meses'};
const FOPT=[['diario','Todos los días'],['semanal','Cada semana'],['quincenal','Cada quincena'],['mensual','Cada mes'],['bimestral','Cada 2 meses (bimestral)']];
function frecTxt(d){const p=pd(d.primero);return d.frec==='diario'?'Todos los días':d.frec==='semanal'?'Semanal, cada '+p.toLocaleDateString('es-MX',{weekday:'long'}):d.frec==='quincenal'?'Quincenal':d.frec==='bimestral'?'Cada 2 meses, el día '+p.getDate():'Mensual, el día '+p.getDate()}
const PPY={diario:365,semanal:52,quincenal:24,mensual:12,bimestral:6};
const rP=d=>d.tasa>0?d.tasa/100/(PPY[d.frec]||12)*(d.iva?1.16:1):0;
function solveR(P,n,A){if(A*n<P-1e-6)return -1;if(A*n<=P+1e-6)return 0;let lo=0,hi=1;for(let i=0;i<100;i++){const m=(lo+hi)/2;if(P*m/(1-Math.pow(1+m,-n))>A)hi=m;else lo=m}return(lo+hi)/2}
function sim(d){const r=rP(d),sg=d.seg||0,A=d.monto-sg;let s=d.saldo,i=0,it=0;
 while(s>0.5&&i<1200){const x=s*r,p=Math.min(A,s+x);if(p<=x+1e-9)return{n:Infinity,it:Infinity,tot:Infinity,sg:Infinity};it+=x;s-=p-x;i++}
 return{n:i,it,sg:sg*i,tot:d.saldo+it+sg*i}}
function interesRows(d){const it=d.saldo*rP(d),sg=d.seg||0,s=sim(d);
 return `<div class="kv"><span>Interés anual (aprox.)</span><b>${(+d.tasa).toFixed(1)}%</b></div><div class="kv"><span>Tu próximo pago se reparte</span><b>${sg>0?'seguro '+mx(sg)+', ':''}interés ${mx(it)}, a tu deuda ${mx(Math.max(0,d.monto-sg-it))}</b></div>`+(isFinite(s.it)?`<div class="kv"><span>Intereses que faltan (aprox.)</span><b>${mx(s.it)}</b></div>${sg>0?`<div class="kv"><span>Seguro que falta (aprox.)</span><b>${mx(s.sg)}</b></div>`:''}<div class="kv"><span>Total que falta pagar (aprox.)</span><b>${mx(s.tot)}</b></div>`:'<div class="kv"><span>Aviso</span><b style="color:var(--bad)">Tu pago no cubre el interés</b></div>')}
function restan(d){const n0=ymd(pd(d.primero)),n=S.pays.filter(p=>p.debt===d.id&&p.cycle>=n0&&p.cycle>1e7).length;return d.n>0?Math.max(0,d.n-n):(d.monto>0?(d.tasa>0?sim(d).n:Math.ceil(d.saldo/d.monto)):0)}
let cur=null;
function render(){
 if(cur){detail();return}
 const t=today(),M=mr(t,0),N=mr(t,1);
 const it=S.debts.map(d=>({d,c:nextCycle(d)}));
 const al=it.filter(x=>x.c&&x.c.days<=5).sort((a,b)=>a.c.days-b.c.days);
 const total=S.debts.reduce((a,d)=>a+d.saldo,0);
 let falta=0,prox=0,np=0;
 S.debts.forEach(d=>{falta+=d.monto*span(d,MIN,M[1]).filter(x=>!x.paid).length;const q=span(d,N[0],N[1]).filter(x=>!x.paid).length;prox+=d.monto*q;np+=q});
 const pagado=S.pays.filter(p=>{const f=new Date(p.fecha);return f.getFullYear()===t.getFullYear()&&f.getMonth()===t.getMonth()}).reduce((a,p)=>a+p.monto,0);
 let h=`<div class="sum"><div class="big"><span>Lo que debes en total</span><b>${mx(total)}</b></div><div><span>Pagado este mes</span><b>${mx(pagado)}</b></div><div><span>Falta pagar este mes</span><b>${mx(falta)}</b></div><div class="big"><span>El próximo mes pagarás</span><b>${mx(prox)}</b><span>${np} ${np===1?'pago':'pagos'} programados</span></div></div>`;
 if('Notification' in window&&Notification.permission==='default')h+=`<p class="mute"><button class="g" id="nt">Activar avisos del teléfono</button></p>`;
 h+='<h2>Toca pagar</h2>';
 if(!al.length)h+='<p class="empty">Nada urgente. Te aviso desde 5 días antes de cada pago.</p>';
 al.forEach(({d,c})=>{const v=c.days<0,n=v?Math.abs(c.days):c.days;
  const big=c.days===0?'<i>Hoy</i>':`<i>${n}</i><small>${v?(n===1?'día tarde':'días tarde'):(n===1?'día':'días')}</small>`;
  h+=`<div class="al ${c.days<=0?'bad':''}"><div class="n">${big}</div><div><strong>${esc(d.name)}: ${mx(d.monto)}</strong><p class="mute">${v?'Venció':'Vence'} el ${fmt(c.due)}. La alerta sigue hasta que subas la captura del pago.</p><button data-pay="${d.id}">Subir comprobante</button></div></div>`});
 h+='<h2>Mis deudas</h2>';
 if(!S.debts.some(x=>!x.servicio))h+='<p class="empty">Aún no agregas nada. Toca “Agregar” para empezar.</p>';
 it.filter(x=>!x.d.servicio).forEach(({d})=>{const pc=total?Math.round(d.saldo/total*100):0;h+=`<button class="r" data-open="${d.id}"><div><b>${esc(d.name)}</b><span class="tag">${esc(d.tipo)}${total?` · ${pc}% de tu deuda`:''}</span><span class="tag" style="display:block">Pagas ${mx(d.monto)} ${FR[d.frec]}</span><div class="bar"><i style="width:${pc}%"></i></div></div><div class="rt"><b>${mx(d.saldo)}</b><span class="mute">Ver detalle ›</span></div></button>`});
 const sv=it.filter(x=>x.d.servicio);
 if(sv.length){h+='<h2>Mis servicios</h2>';sv.forEach(({d,c})=>{h+=`<button class="r" data-open="${d.id}"><div><b>${esc(d.name)}</b><span class="tag">${c?'Próximo pago: '+fmt(c.due):'Sin pendientes'}</span></div><div class="rt"><b>${mx(d.monto)}</b><span class="mute">cada mes ›</span></div></button>`})}
 $('#app').innerHTML=h;
 if(al.length&&'Notification' in window&&Notification.permission==='granted'){try{new Notification('Al Corriente',{body:`Tienes ${al.length} pago(s) por hacer`})}catch(e){}}
}
function detail(){
 const d=S.debts.find(x=>x.id===cur);if(!d){cur=null;render();return}
 const t=today(),M=mr(t,0),N=mr(t,1),c=nextCycle(d);
 const ps=S.pays.filter(p=>p.debt===d.id).sort((a,b)=>b.fecha.localeCompare(a.fecha));
 const desde=d.desde?pd(d.desde):new Date(+d.id.slice(1));
 const mes=span(d,M[0],M[1]),pend=span(d,MIN,M[1]).filter(x=>!x.paid),prox=span(d,N[0],N[1]).filter(x=>!x.paid);
 const est=pend.length?`<b style="color:var(--${pend[0].due<t?'bad':'warn'})">${pend[0].due<t?'Vencido':'Falta pagar'}</b>`:mes.length?'<b class="ok">Pagado</b>':'<b>No toca este mes</b>';
 const r=restan(d);let fin='';
 if(d.n>0){let l;for(const x of seq(d))l=x;fin=l?fd(l):''}
 if(d.servicio){let s=`<p><button class="g" id="bk">← Volver</button></p><h1>${esc(d.name)}</h1><p class="mute">Servicio, se paga cada mes</p>
<div class="sum"><div class="big"><span>Pagas cada mes</span><b>${mx(d.monto)}</b></div><div><span>Estado</span>${est}</div><div><span>Próximo pago</span><b>${c?fmt(c.due):'Sin pendientes'}</b></div></div>
<div class="d" style="margin-top:10px"><div class="kv"><span>Día de pago</span><b>El ${pd(d.primero).getDate()} de cada mes</b></div><div class="kv"><span>Último pago</span><b>${ps.length?fd(new Date(ps[0].fecha)):'Aún sin pagos'}</b></div><div class="kv"><span>Pagado en total</span><b>${mx(ps.reduce((a,p)=>a+p.monto,0))}</b></div></div>
<div class="row"><button data-pay="${d.id}">Registrar pago</button><button class="g" data-edit="${d.id}">Editar</button><button class="g" data-del="${d.id}">Borrar servicio</button></div><h2>Pagos de este servicio</h2>`;
  if(!ps.length)s+='<p class="empty">Cuando subas un comprobante, aparece aquí.</p>';
  ps.forEach(p=>{s+=`<div class="h"><img src="${p.img}" data-img="${p.id}" alt="Comprobante"><div><b>${fd(new Date(p.fecha))}</b></div><b>${mx(p.monto)}</b></div>`});
  $('#app').innerHTML=s;return}
 let h=`<p><button class="g" id="bk">← Volver</button></p><h1>${esc(d.name)}</h1><p class="mute">${esc(d.tipo)}</p>
<div class="sum"><div class="big"><span>Debes en esta deuda</span><b>${mx(d.saldo)}</b></div><div><span>Abono de este mes</span><b>${mx(d.monto*mes.length)}</b></div><div><span>Estado</span>${est}</div><div class="big"><span>El próximo mes pagas</span><b>${mx(d.monto*prox.length)}</b><span>${prox.length} ${prox.length===1?'pago':'pagos'} de ${mx(d.monto)}</span></div></div>
<div class="d" style="margin-top:10px"><div class="kv"><span>Último pago</span><b>${ps.length?fd(new Date(ps[0].fecha)):'Aún sin pagos'}</b></div><div class="kv"><span>Frecuencia</span><b>${frecTxt(d)}</b></div><div class="kv"><span>Pagas cada vez</span><b>${mx(d.monto)}</b></div>${d.tasa>0?interesRows(d):''}<div class="kv"><span>Próximo pago</span><b>${c?fd(c.due):'Sin pendientes'}</b></div><div class="kv"><span>${d.n>0?'Pagos que faltan':'Pagos para liquidar'}</span><b>${d.n>0?r+' de '+d.n:isFinite(r)?'≈ '+r:'Revisa tu pago'}</b></div>${fin?`<div class="kv"><span>Termina el</span><b>${fin}</b></div>`:''}<div class="kv"><span>Pagado en total</span><b>${mx(ps.reduce((a,p)=>a+p.monto,0))}</b></div></div>
<div class="row"><button data-pay="${d.id}">Registrar pago</button><button class="g" data-edit="${d.id}">Editar</button><button class="g" data-del="${d.id}">Borrar deuda</button></div><h2>Pagos de esta deuda</h2>`;
 if(!ps.length)h+='<p class="empty">Cuando subas un comprobante, aparece aquí.</p>';

 let manual=false;
 const NP=(mo,f)=>f==='bimestral'?Math.max(1,Math.round(mo/2)):f==='mensual'?Math.round(mo):f==='quincenal'?Math.round(mo*2):f==='semanal'?Math.round(mo*52/12):Math.round(mo*365/12);
 const calc=()=>{const k=kk.value;if(k==='servicio')return;const cr=k==='hipotecario'||k==='auto',s=+$('#s').value,mo=+$('#pl').value,f=cr?'mensual':$('#f').value,n=mo>0?Math.max(1,NP(mo,f)):0;

  if(n>0&&s>0){const x=Math.ceil(s/n);if(!manual)$('#m').value=x;$('#hp').textContent=`Son ${n} pagos (${FR[f]}). ${manual?'Estás usando tu propio monto.':'Calculado: '+mx(x)+' cada vez, puedes cambiarlo.'}`}else $('#hp').textContent=''};

  S.debts.push(sv?{id:'d'+Date.now(),name,tipo:'Servicio',servicio:true,saldo:0,monto,frec:$('#f').value,primero,n:0,desde:primero}:{id:'d'+Date.now(),name,tipo:cr?(kd==='auto'?'Crédito automotriz':'Crédito hipotecario'):($('#t').value.trim()||'Otro'),cred:cr,saldo,monto,seg,frec:f,primero,n,tasa,iva:false,desde:iso(today())});save();close();render()}};
function edit(id){const d=S.debts.find(x=>x.id===id);if(!d)return;const sv=d.servicio,cr=d.cred,c=nextCycle(d),base=c?iso(c.due):d.primero,r=d.n>0?restan(d):'';

function shrink(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.6))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}
function pay(id){const d=S.debts.find(x=>x.id===id),c=nextCycle(d),cr=d.cred;let img=null;

 pi();$('#pm').oninput=()=>{chk();pi()};if(cr)$('#ps').oninput=pi;$('#cn').onclick=close;
 $('#pf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{img=await shrink(f);$('#pp').src=img;$('#pp').hidden=false}catch(x){img=null;alert('No pude leer esa imagen. Prueba con otra.')}chk()};

/* avisos en el calendario del iPhone (.ics) */
function icsCal(){
 const t=today(),lim=new Date(t.getFullYear(),t.getMonth(),t.getDate()+90),L=[],p2=n=>String(n).padStart(2,'0');
 const e2=x=>String(x).replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n'),ts=d=>d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate());
 const w=new Date(),stamp=w.getUTCFullYear()+p2(w.getUTCMonth()+1)+p2(w.getUTCDate())+'T'+p2(w.getUTCHours())+p2(w.getUTCMinutes())+p2(w.getUTCSeconds())+'Z';
 let n=0;
 const ev=(id,day,title,desc)=>{n++;L.push('BEGIN:VEVENT','UID:'+id+'@alcorriente','DTSTAMP:'+stamp,'DTSTART:'+ts(day)+'T090000','DTEND:'+ts(day)+'T091500','SUMMARY:'+e2(title),'DESCRIPTION:'+e2(desc),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+e2(title),'TRIGGER:PT0S','END:VALARM','END:VEVENT')};
 S.debts.forEach(d=>{let c=0,late=false;const nm=d.name,m=mx(d.monto),desc='Al Corriente: sube tu comprobante al pagar. Pago de '+m+'.';
  for(const due of seq(d)){
   if(due>lim||c>=40||(d.frec==='diario'&&due>new Date(t.getFullYear(),t.getMonth(),t.getDate()+14)))break;
   const k=ymd(due);if(paid(d,k))continue;c++;
   if(due<t){if(!late){late=true;ev(d.id+'-late',t,'Vencido: '+nm+' '+m,desc+' Ya venció, sube tu comprobante.')}continue}
   if(d.frec==='diario'||d.frec==='semanal')ev(d.id+'-'+k+'-0',due,'Hoy toca pagar: '+nm+' '+m,desc);
   else for(let b=5;b>=0;b--){const day=new Date(due.getFullYear(),due.getMonth(),due.getDate()-b);if(day<t)continue;
    ev(d.id+'-'+k+'-'+b,day,b>1?'Faltan '+b+' días: '+nm+' '+m:b===1?'Mañana vence: '+nm+' '+m:'Hoy toca pagar: '+nm+' '+m,desc)}
  }});
 return{n,ics:['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Al Corriente//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Al Corriente',...L,'END:VCALENDAR'].join('\r\n')+'\r\n'}}
function calendario(){
 const r=icsCal();if(!r.n){alert('No hay pagos pendientes para agregar.');return}
 const u=URL.createObjectURL(new Blob([r.ics],{type:'text/calendar'})),a=document.createElement('a');
 a.href=u;a.download='al-corriente.ics';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);
 alert('Listo: '+r.n+' avisos. Abre el archivo y elige “Agregar todo”.')}
const _r2=render;render=()=>{_r2();if(!cur&&S.debts.length){const b=$('.sum');if(b){b.insertAdjacentHTML('afterend','<p style="margin:12px 0 0"><button class="g" id="cal">Agregar avisos a mi calendario</button></p>');$('#cal').onclick=calendario}}};
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')}catch(e){}
save();render();
